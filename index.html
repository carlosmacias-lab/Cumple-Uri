<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copa Pabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style id="app-style">
/* Layout: estadio de noche — marcador de transmisión arriba, pestañas fijas, una columna angosta pensada para el celular */
:root{
  --night:#0a1411; --turf:#0f221b; --turf-2:#14302566; --line:#21402f; --chalk:#eef4ef; --muted:#8fa79a;
  --gold:#f3b734; --gold-ink:#2a1d00; --live:#ff5247; --silver:#c7d0d6; --bronze:#d38b55; --win:#5fd38d;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.linkish{background:none;cursor:pointer}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:repeating-linear-gradient(90deg,transparent 0 56px,rgba(255,255,255,.018) 56px 112px);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Header */
.hdr{padding-block:28px 18px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-num);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.brand{font-family:var(--f-display);font-weight:900;font-size:clamp(54px,15vw,96px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.brand span{color:var(--gold)}
.sub{color:var(--muted);margin:0;max-width:52ch}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--f-num);font-weight:700;letter-spacing:.08em;font-size:12px;text-transform:uppercase;color:var(--chalk)}
.pill.live{border-color:var(--live);color:var(--live)}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.live .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 12px 10px;font-family:var(--f-num);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--chalk);border-color:var(--gold)}
.tab .n{color:var(--live)}
main{display:grid;gap:22px;padding-top:20px}
.sec{display:grid;gap:10px}
.sec h2{font-family:var(--f-num);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}

/* Teams */
.tname{font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tmeta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.crest{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.02em;color:#fff;background:hsl(var(--h) 55% 32%);border:1px solid hsl(var(--h) 60% 48%)}
.team{display:flex;gap:10px;align-items:center;min-width:0}
.team > div{min-width:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tcard{background:var(--turf);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* Scoreboard */
.board{background:linear-gradient(180deg,#132a21,#0d1d17);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.board.live{border-color:#ff524766;box-shadow:0 0 0 1px #ff524722,0 10px 40px -12px #ff524744}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stage{font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:grid;gap:4px;justify-items:center;text-align:center;min-width:0}
.side .crest{width:46px;height:46px;font-size:16px;border-radius:12px}
.score{font-family:var(--f-num);font-weight:700;font-size:58px;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.score .sep{color:var(--muted);font-size:36px}
.pens{text-align:center;color:var(--gold);font-family:var(--f-num);font-weight:600;letter-spacing:.06em;font-size:14px}

/* Match rows */
.rows{display:grid;gap:6px}
.mrow{background:var(--turf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.mrow.live{border-color:#ff524788}
.mline{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.mline .r{text-align:right}
.mline .l, .mline .r{min-width:0}
.mline .tname{font-size:15px}
.mline .tmeta{font-size:12px}
.mscore{font-family:var(--f-num);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.mscore.pending{color:var(--muted);font-size:16px;letter-spacing:.08em}
.w{color:var(--win)}
.tbd{color:var(--muted);font-style:italic}

/* Admin controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;border-top:1px dashed var(--line);padding-top:10px}
.btn{border:1px solid var(--line);background:#1a3529;border-radius:8px;padding:9px 14px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.danger{border-color:#ff524788;color:#ffb3ad;background:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .btn{min-width:44px;padding:8px 0;font-size:20px;line-height:1}
.stepper b{font-family:var(--f-num);font-size:26px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.adm-score{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.adm-side{display:grid;gap:6px;justify-items:center;text-align:center;min-width:0}
.adm-side small{color:var(--muted);overflow-wrap:anywhere}
.pen-pick{display:grid;gap:6px;width:100%;text-align:center;color:var(--gold);font-size:13px}
.pen-pick .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn.sel{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

/* Table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--turf)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-num);font-weight:600;letter-spacing:.08em;font-size:12px;color:var(--muted);text-transform:uppercase}
td.tl,th.tl{text-align:left}
td.pts{font-weight:700;color:var(--gold)}
tr:last-child td{border-bottom:0}
.pos{font-family:var(--f-num);font-weight:700;color:var(--muted)}

/* Bracket */
.bracket{overflow-x:auto;padding-bottom:6px}
.bcols{display:flex;gap:14px;min-width:max-content}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;width:200px}
.bcol h3{font-family:var(--f-num);font-weight:700;letter-spacing:.1em;font-size:13px;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.bm{background:var(--turf);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bm.live{border-color:#ff524788}
.bt{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:14px}
.bt + .bt{border-top:1px solid var(--line)}
.bt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bt.win{color:var(--win);font-weight:600}

/* Podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;padding-top:6px}
.step{display:grid;gap:8px;justify-items:center;text-align:center;min-width:0}
.block{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:44px;color:var(--night)}
.p1 .block{height:130px;background:linear-gradient(180deg,#ffd76a,var(--gold))}
.p2 .block{height:96px;background:linear-gradient(180deg,#e6ecef,var(--silver))}
.p3 .block{height:72px;background:linear-gradient(180deg,#eaa877,var(--bronze))}
.step .tname{font-size:16px}
.p1 .tname{font-size:19px;color:var(--gold)}
.champ{background:radial-gradient(120% 90% at 50% 0%,#3a2e0a 0%,var(--turf) 60%);border:1px solid #f3b73455;border-radius:14px;padding:18px 14px 0;display:grid;gap:10px;overflow:hidden}
.champ h2{color:var(--gold);text-align:center;font-family:var(--f-display);font-size:30px;letter-spacing:.04em;font-weight:900}
.trophy{width:56px;height:56px;margin:0 auto}

/* Forms */
.panel{background:var(--turf);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-family:var(--f-num);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%;color:var(--chalk)}
input::placeholder{color:#5f7a6c}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{text-align:left;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:2px}
.seg button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.seg b{font-size:15px}
.seg span{font-size:12px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:0}
.err{color:#ffb3ad;font-size:13px;margin:0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);display:grid;gap:6px}
.empty b{color:var(--chalk);font-size:16px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--night);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.saving{position:fixed;inset:0;background:#0a1411aa;display:grid;place-items:center;z-index:15;font-family:var(--f-num);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

@media (max-width:480px){
  .grid2,.seg{grid-template-columns:1fr}
  .score{font-size:46px}
  .mline .tmeta{display:none}
  .block{font-size:34px}
}
@media (prefers-reduced-motion:reduce){.pill.live .dot{animation:none}}
</style>
</head>
<body>
<script type="application/json" id="copa-state">{"v":1,"phase":"registro","format":"llaves","teams":[],"matches":[],"updated":0}</script>
<div class="wrap" id="app"></div>
<script id="app-script">
(function(){
"use strict";
var CLUBS=["Real Madrid","FC Barcelona","Manchester City","Liverpool","Arsenal","Chelsea","Manchester United","Tottenham Hotspur","Newcastle United","Aston Villa","Bayern München","Borussia Dortmund","Bayer Leverkusen","Paris Saint-Germain","Inter","AC Milan","Juventus","Napoli","Atlético de Madrid","Benfica","FC Porto","Sporting CP","Ajax","PSV","Club América","Chivas","Cruz Azul","Pumas UNAM","Tigres UANL","Monterrey","Toluca","Boca Juniors","River Plate","Inter Miami","Al Nassr","Al Hilal","México","Argentina","Brasil","Francia","España","Inglaterra","Alemania","Portugal","Países Bajos","Italia","Bélgica","Croacia","Uruguay","Colombia","Estados Unidos","Japón","Marruecos"];

var S=JSON.parse(document.getElementById('copa-state').textContent);
var API='/api/state', PKEY='copa-admin-pass';
function lget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lset(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
var pass=lget(PKEY)||'';
var canEdit=false, adminMode=true, loaded=false, dbError='', loginErr='', saving=false, dirty=false;
var tab=store('get','copa-tab')||'vivo';
var draftFormat=S.format||'llaves';
var confirmKey=null, saveTimer=null, formErr='', editId=null, editErr='';

function store(op,k,v){try{if(op==='get')return sessionStorage.getItem(k);sessionStorage.setItem(k,v);}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function T(id){for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null}
function isAdmin(){return canEdit&&adminMode}
function hue(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function abbr(club){var w=String(club||'?').replace(/^(FC|AC|CF|Club)\s+/i,'').split(/\s+/);return (w.length>1?w.map(function(x){return x[0]}).join('').slice(0,3):w[0].slice(0,3)).toUpperCase()}
function crest(t){if(!t)return '<div class="crest" style="--h:150">?</div>';return '<div class="crest" style="--h:'+hue(t.club)+'" title="'+esc(t.club)+'">'+esc(abbr(t.club))+'</div>'}
function meta(t){return esc(t.p1)+' y '+esc(t.p2)+' · '+esc(t.club)}

/* ---------- Tournament logic ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function buildKO(ids){
  var n=ids.length,size=1;while(size<n)size*=2;
  var m=size/2,byes=size-n,R=Math.log2(size),out=[];
  var t=shuffle(ids);
  /* spread byes across the bracket (bit-reversed slots) so bye teams land in different halves */
  var bits=Math.log2(m),slots=[];for(var q=0;q<m;q++){var rv=0;for(var bb=0;bb<bits;bb++)if(q&(1<<bb))rv|=1<<(bits-1-bb);slots.push(rv)}
  var byeSet={};slots.slice(0,byes).forEach(function(x){byeSet[x]=1});
  var k=0;
  for(var i=0;i<m;i++){var ta=t[k++],tb=byeSet[i]?null:t[k++];out.push({id:uid(),stage:'ko',round:1,idx:i,a:ta,b:tb,ga:0,gb:0,pen:null,status:'pendiente'})}
  for(var r=2;r<=R;r++){var c=size/Math.pow(2,r);for(var k=0;k<c;k++)out.push({id:uid(),stage:'ko',round:r,idx:k,ga:0,gb:0,pen:null,status:'pendiente'})}
  if(R>=2)out.push({id:uid(),stage:'tercer',round:R,idx:0,ga:0,gb:0,pen:null,status:'pendiente'});
  return out;
}
function buildLiga(ids){
  var t=shuffle(ids);if(t.length%2)t.push(null);
  var n=t.length,out=[];
  for(var r=0;r<n-1;r++){
    for(var i=0;i<n/2;i++){var a=t[i],b=t[n-1-i];if(a&&b)out.push({id:uid(),stage:'liga',round:r+1,idx:i,a:(r%2?b:a),b:(r%2?a:b),ga:0,gb:0,pen:null,status:'pendiente'})}
    t.splice(1,0,t.pop());
  }
  return out;
}
function koRounds(){var R=0;S.matches.forEach(function(m){if(m.stage==='ko'&&m.round>R)R=m.round});return R}
function getKO(r,i){for(var k=0;k<S.matches.length;k++){var m=S.matches[k];if(m.stage==='ko'&&m.round===r&&m.idx===i)return m}return null}
/* participants: string id = team, null = nobody (bye), undefined = still to be decided */
/* A match with `via` sends its winner to a play-in final first; the play-in final's winner moves on instead */
function feedWinner(f){if(!f)return undefined;return f.via?winner(M(f.via)):winner(f)}
function sides(m){
  if(m.stage==='liga')return[m.a,m.b];
  if(m.stage==='ko'&&m.round===1)return[m.a,m.b];
  if(m.stage==='prev')return[m.a,m.b];
  if(m.stage==='extra')return m.feedA?[winner(M(m.feedA)),winner(M(m.feedB))]:[m.a,m.b];
  if(m.stage==='ko')return[feedWinner(getKO(m.round-1,m.idx*2)),feedWinner(getKO(m.round-1,m.idx*2+1))];
  var R=koRounds();return[loser(getKO(R-1,0)),loser(getKO(R-1,1))];
}
function result(m){
  var s=sides(m),a=s[0],b=s[1];
  if(a===undefined||b===undefined)return undefined;
  if(a===null&&b===null)return{w:null,l:null};
  if(b===null)return{w:a,l:null};
  if(a===null)return{w:b,l:null};
  if(m.status!=='final')return undefined;
  if(m.ga>m.gb)return{w:a,l:b};
  if(m.gb>m.ga)return{w:b,l:a};
  if(m.stage==='liga')return{w:null,l:null,draw:true};
  return m.pen==='a'?{w:a,l:b}:m.pen==='b'?{w:b,l:a}:undefined;
}
function winner(m){if(!m)return undefined;var r=result(m);return r===undefined?undefined:r.w}
function loser(m){if(!m)return undefined;var r=result(m);return r===undefined?undefined:r.l}
function playable(m){var s=sides(m);return typeof s[0]==='string'&&typeof s[1]==='string'}
function stageName(m){
  if(m.stage==='extra')return m.label;
  if(m.stage==='prev')return 'Primera ronda';
  if(m.stage==='liga')return 'Jornada '+m.round;
  if(m.stage==='tercer')return 'Tercer lugar';
  var c=Math.pow(2,koRounds()-m.round);
  return c===1?'Final':c===2?'Semifinal':c===4?'Cuartos de final':c===8?'Octavos de final':'Ronda '+m.round;
}
function order(m){return m.stage==='extra'||m.stage==='prev'?m.ord:m.stage==='liga'?m.round*100+m.idx:m.stage==='tercer'?(m.round-0.5)*100:m.round*100+m.idx}
function sortedMatches(){return S.matches.slice().sort(function(x,y){return order(x)-order(y)})}
function standings(){
  var tb={};S.teams.forEach(function(t){tb[t.id]={id:t.id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}});
  S.matches.forEach(function(m){if(m.stage!=='liga'||m.status!=='final')return;var A=tb[m.a],B=tb[m.b];if(!A||!B)return;
    A.pj++;B.pj++;A.gf+=m.ga;A.gc+=m.gb;B.gf+=m.gb;B.gc+=m.ga;
    if(m.ga>m.gb){A.g++;B.p++;A.pts+=3}else if(m.gb>m.ga){B.g++;A.p++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}});
  return Object.keys(tb).map(function(k){return tb[k]}).sort(function(x,y){return y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||(T(x.id).name).localeCompare(T(y.id).name)});
}
function podium(){
  if(S.phase!=='torneo'||!S.matches.length)return null;
  if(S.format==='liga'){
    if(S.matches.some(function(m){return m.status!=='final'}))return null;
    var st=standings();return[st[0]&&st[0].id,st[1]&&st[1].id,st[2]&&st[2].id];
  }
  var R=koRounds(),f=getKO(R,0);if(!f)return null;var fr=result(f);if(fr===undefined)return null;
  var third=null;
  var tm=S.matches.filter(function(m){return m.stage==='tercer'})[0];
  if(tm){var tr=result(tm);if(tr===undefined)return null;third=tr.w}
  return[fr.w,fr.l,third];
}
function dependents(m){
  if(m.stage==='prev')return S.matches.filter(function(x){return x.stage==='ko'||x.stage==='tercer'});
  if(m.stage==='extra'){var out2=[];S.matches.forEach(function(x){
    if(x.stage==='extra'&&(x.feedA===m.id||x.feedB===m.id))out2.push(x);
    if(x.stage==='ko'&&x.via===m.id){var n2=getKO(x.round+1,Math.floor(x.idx/2));if(n2)out2.push(n2)}});return out2}
  if(m.stage!=='ko')return[];
  if(m.via){var y=M(m.via);return y?[y]:[]}
  var R=koRounds(),out=[];var nx=getKO(m.round+1,Math.floor(m.idx/2));if(nx)out.push(nx);
  if(m.round===R-1)S.matches.forEach(function(x){if(x.stage==='tercer')out.push(x)});
  return out;
}
function canReopen(m){return dependents(m).every(function(d){return d.status==='pendiente'})}

/* ---------- Server sync (Vercel API + Upstash Redis) ---------- */
function api(method,body){
  return fetch(API,{method:method,cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{ok:r.ok,status:r.status,j:j}})});
}
function save(delay){
  S.updated=Date.now();dirty=true;render();
  clearTimeout(saveTimer);saveTimer=setTimeout(push,delay==null?500:delay);
}
function push(){
  saveTimer=null;
  if(saving){saveTimer=setTimeout(push,400);return}
  saving=true;dirty=false;
  api('POST',{password:pass,state:S}).then(function(res){
    saving=false;
    if(res.status===401){canEdit=false;pass='';lset(PKEY,null);tab='login';loginErr='Tu sesión de admin ya no es válida. Vuelve a entrar.';render();return}
    if(!res.ok){dirty=true;toast((res.j.error||'No se guardó el cambio.')+' Reintentando…');saveTimer=setTimeout(push,3000);return}
    render();
  }).catch(function(){saving=false;dirty=true;toast('Sin conexión. Reintentando…');saveTimer=setTimeout(push,3000)});
}
function busy(){return dirty||saving||saveTimer}
function pull(){
  if(busy())return;
  api('GET').then(function(res){
    if(!res.ok){dbError=res.j.error||'No se pudo cargar el torneo.';loaded=true;render();return}
    var first=!loaded||dbError;dbError='';loaded=true;
    if(busy())return;
    var st=res.j.state;
    if(st&&st.teams&&st.matches&&st.updated!==S.updated){S=st;if(S.phase==='registro'&&S.format)draftFormat=S.format;render();return}
    if(first)render();
  }).catch(function(){if(!loaded){dbError='Sin conexión. Reintentando…';loaded=true;render()}});
}

      +'<button type="button" data-act="fmt" data-f="liga" aria-pressed="'+(draftFormat==='liga')+'"><b>Liga</b><span>Todos contra todos. Victoria 3 pts, empate 1. El podio sale de la tabla.</span></button></div>'
      +(S.teams.length<3?'<p class="note">Se necesitan al menos 3 equipos para tener 1º, 2º y 3º lugar.</p>':'<p class="note">'+matchCountNote()+'</p>')
      +'<div class="row-actions"><button class="btn primary" data-act="start-t"'+(S.teams.length<3?' disabled':'')+'>'+(confirmKey==='start-t'?'Confirmar: sortear y arrancar':'Sortear y arrancar torneo')+'</button></div></section>';
  }else{
    var fb=freeByes(),canAdd=S.format==='liga'||fb.length>0;
    if(canAdd){
      h+='<form class="panel" id="team-form" autocomplete="off"><h3>Agregar equipo al torneo</h3>';
      h+='<p class="note">'+(S.format==='liga'
        ?'El equipo nuevo juega contra todos los demás. Sus partidos se agregan al final del calendario y los resultados de hoy no cambian.'
        :'Quedan '+fb.length+' '+(fb.length===1?'lugar':'lugares')+' de pase directo. El equipo nuevo juega la primera ronda contra '+esc((T(fb[0].a||fb[0].b)||{}).name||'el equipo con pase directo')+', que ya no pasa directo. Lo demás no cambia.')+'</p>'
        +teamFields()+(formErr?'<p class="err">'+esc(formErr)+'</p>':'')
        +'<div class="row-actions"><button class="btn primary" type="submit">Agregar al torneo</button></div>';
    }else{
      h+='</form>';
    }
    var hasPrev=S.matches.some(function(m){return m.stage==='prev'}),anyLive=S.matches.some(function(m){return m.status==='vivo'});
    if(S.format!=='liga'&&!canAdd&&!hasPrev){
      h+='<form class="panel" id="reorg-form" autocomplete="off"><h3>Agregar 2 equipos y rehacer las llaves</h3>'
        +'<p class="note">Los partidos ya jugados cuentan como primera ronda (cada equipo juega uno). Los 2 equipos nuevos juegan su partido de primera ronda entre ellos. Los cruces que todavía no se juegan se quitan. Cuando termine la primera ronda, sorteas la segunda ronda con los ganadores.</p>'
        +teamFieldsP('n1','Equipo nuevo 1')+teamFieldsP('n2','Equipo nuevo 2')
        +'<datalist id="clubs-p">'+CLUBS.map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist>'
        +(anyLive?'<p class="err">Hay un partido en vivo. Termínalo o cancélalo antes de rehacer las llaves.</p>':'')
        +(playinErr?'<p class="err">'+esc(playinErr)+'</p>':'')
        +'<div class="row-actions"><button class="btn primary" type="submit"'+(anyLive?' disabled':'')+'>'+(confirmKey==='reorg'?'Confirmar: agregar y rehacer llaves':'Agregar equipos y rehacer llaves')+'</button></div></form>';
    }
    if(hasPrev&&!koRounds()){
      var prevM=S.matches.filter(function(m){return m.stage==='prev'});
      var pend=prevM.filter(function(m){return m.status!=='final'}).length;
      var surv=pend?[]:survivors();
      h+='<section class="panel"><h3>Sortear segunda ronda</h3>'
        +(pend?'<p class="note">Faltan '+pend+' '+(pend===1?'partido':'partidos')+' de primera ronda. Cuando terminen, aquí sorteas las llaves con los ganadores.</p>'
          :'<p class="note">Pasan '+surv.length+' equipos: '+surv.map(function(id){return esc((T(id)||{}).name)}).join(', ')+'. Se sortean llaves de eliminación directa con partido por el 3er lugar'+(function(){var z=1;while(z<surv.length)z*=2;var by=z-surv.length;return by?'; '+by+' '+(by===1?'equipo pasa':'equipos pasan')+' directo por sorteo':''})()+'.</p>'
            +'<div class="row-actions"><button class="btn primary" data-act="draw-r2"'+(surv.length<3?' disabled':'')+'>'+(confirmKey==='draw-r2'?'Confirmar: sortear segunda ronda':'Sortear segunda ronda')+'</button></div>')
        +'</section>';
    }
    h+='<section class="sec"><h2>Equipos ('+S.teams.length+')</h2><p class="note">Puedes corregir nombres, jugadores o club. Los resultados no cambian.</p>'+teamsGrid(false,true)+'</section>';
    h+='<section class="panel"><h3>Cómo capturar resultados</h3><p class="note">En las pestañas En vivo o Partidos, toca “Empezar partido”, suma los goles con + y − mientras juegan y toca “Terminar partido”. Cada cambio se guarda solo y llega a todos los celulares en unos segundos.</p></section>';
    h+='<section class="panel"><h3>Reiniciar</h3><p class="note">Volver a inscripciones borra todos los resultados y el sorteo; solo conserva los equipos. Para sumar equipos sin perder nada, usa “Agregar equipo al torneo”.</p><div class="row-actions">'
      +'<button class="btn danger" data-act="reset-keep">'+(confirmKey==='reset-keep'?'¿Seguro? Toca de nuevo':'Volver a inscripciones')+'</button>'
      +'<button class="btn danger" data-act="reset-all">'+(confirmKey==='reset-all'?'¿Seguro? Se borra todo':'Borrar todo')+'</button></div></section>';
  }
  return h;
}
function viewLogin(){
  return '<form class="panel" id="login-form"><h3>Entrar como admin</h3><p class="note">Solo quien organiza el torneo puede inscribir equipos y capturar resultados. Los demás pueden ver todo en vivo sin entrar.</p>'
    +'<label>Contraseña<input id="f-pass" type="password" autocomplete="current-password" required></label>'
    +(loginErr?'<p class="err">'+esc(loginErr)+'</p>':'')
    +'<div class="row-actions"><button class="btn primary" type="submit">Entrar</button></div></form>';
}
function matchCountNote(){var n=S.teams.length;if(draftFormat==='liga')return n+' equipos → '+(n*(n-1)/2)+' partidos.';var size=1;while(size<n)size*=2;var byes=size-n;return n+' equipos → '+(n-1+(n>=3?1:0))+' partidos'+(byes?', '+byes+' '+(byes===1?'equipo pasa':'equipos pasan')+' directo a la segunda ronda por sorteo':'')+'.'}

function render(){
  var app=document.getElementById('app');
  var focusId=document.activeElement&&document.activeElement.id;
  var vals={};app.querySelectorAll('input[id],select[id]').forEach(function(e){if(e.type!=='password'||e.id==='f-pass')vals[e.id]=e.value});
  if(tab==='admin'&&!isAdmin())tab='vivo';
  if(tab==='login'&&canEdit)tab='admin';
  var p=podium(),liveN=S.matches.filter(function(m){return m.status==='vivo'}).length;
  var status=S.phase==='registro'?'<span class="pill">Inscripciones abiertas</span>':p?'<span class="pill gold">Torneo terminado</span>':liveN?'<span class="pill live"><span class="dot"></span>'+liveN+' en vivo</span>':'<span class="pill">En juego</span>';
  var upd=S.updated?new Date(S.updated).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'';
  var tabs=[['vivo','En vivo'],['partidos','Partidos'],['tabla',S.phase!=='registro'&&S.format==='liga'?'Tabla':S.phase==='registro'?'Tabla':'Llaves'],['equipos','Equipos']];
  if(isAdmin())tabs.push(['admin','Admin']);
  var body=!loaded?'<div class="empty"><b>Cargando el torneo…</b></div>':tab==='login'?viewLogin():tab==='partidos'?viewPartidos():tab==='tabla'?viewTabla():tab==='equipos'?viewEquipos():tab==='admin'?viewAdmin():viewVivo();
  app.innerHTML='<header class="hdr"><div class="eyebrow">Torneo FIFA 2 vs 2 · Cumpleaños de Pabs</div><h1 class="brand">Copa <span>Pabs</span></h1>'
    +'<div class="eyebrow">'+status+(upd?'<span>Actualizado '+esc(upd)+'</span>':'')
    +(dirty||saving?'<span>Guardando…</span>':'')
    +(canEdit?'<button class="pill linkish" data-act="admin-mode">'+(adminMode?'Ver como invitado':'Volver a modo admin')+'</button><button class="pill linkish" data-act="logout">Salir de admin</button>'
      :'<button class="pill linkish" data-act="tab" data-tab="login">Admin</button>')+'</div>'
    +(dbError?'<p class="err">'+esc(dbError)+'</p>':'')+'</header>'
    +'<nav class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab" role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+(t[0]==='vivo'&&liveN?' <span class="n">●</span>':'')+'</button>'}).join('')+'</nav>'
    +'<main>'+body+'</main>';
  Object.keys(vals).forEach(function(k){var e=document.getElementById(k);if(e)e.value=vals[k]});
  if(focusId){var f=document.getElementById(focusId);if(f)f.focus()}
}

/* ---------- Events ---------- */
function M(id){for(var i=0;i<S.matches.length;i++)if(S.matches[i].id===id)return S.matches[i]}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id'),m=id&&M(id);
  if(act!=='del-team'&&act!=='start-t'&&act!=='draw-r2'&&act!=='del-prev'&&act.indexOf('reset')!==0&&act.indexOf('-local')<0)confirmKey=null;
  if(act==='tab'){tab=b.getAttribute('data-tab');store('set','copa-tab',tab);render();window.scrollTo(0,0);return}
  if(act==='admin-mode'){adminMode=!adminMode;render();return}
  if(act==='logout'){canEdit=false;pass='';lset(PKEY,null);tab='vivo';render();return}
  if(!isAdmin())return;
  if(act==='del-prev'){if(confirmKey!=='delp-'+id){confirmKey='delp-'+id;render();return}confirmKey=null;
    if(!m||m.stage!=='prev'||koRounds())return;
    S.matches=S.matches.filter(function(x){return x.id!==id});save();toast('Partido quitado.');return}
  if(act==='draw-r2'){if(confirmKey!=='draw-r2'){confirmKey='draw-r2';render();return}confirmKey=null;
    var pm=S.matches.filter(function(m){return m.stage==='prev'});
    if(pm.some(function(m){return m.status!=='final'})||koRounds())return;
    var sv=survivors();
    S.matches=pm.concat(buildKO(sv));tab='tabla';save();toast('Segunda ronda sorteada.');return}
  if(act==='edit-team'){editId=id;editErr='';render();var en=document.getElementById('e-name');if(en)en.focus();return}
  if(act==='edit-cancel'){editId=null;editErr='';render();return}
  if(act==='fmt'){draftFormat=b.getAttribute('data-f');render();return}
  if(act==='del-team'){if(confirmKey!=='del-'+id){confirmKey='del-'+id;render();return}confirmKey=null;S.teams=S.teams.filter(function(t){return t.id!==id});save();return}
  if(act==='start-t'){if(confirmKey!=='start-t'){confirmKey='start-t';render();return}confirmKey=null;
    var ids=S.teams.map(function(t){return t.id});S.format=draftFormat;S.matches=draftFormat==='liga'?buildLiga(ids):buildKO(ids);S.phase='torneo';tab='vivo';save(300);return}
  if(act==='upload-local'||act==='forget-local'){if(confirmKey!==act){confirmKey=act;render();return}confirmKey=null;
    var lc=localCopy();lset('copa-pabs-state',null);
    if(act==='upload-local'&&lc){S=lc;if(S.format)draftFormat=S.format;tab='vivo';save(0);toast('Listo: todos ven ahora tu torneo.')}else render();
    return}
  if(act==='reset-keep'||act==='reset-all'){if(confirmKey!==act){confirmKey=act;render();return}confirmKey=null;
    S.phase='registro';S.matches=[];if(act==='reset-all')S.teams=[];tab=act==='reset-all'?'admin':'admin';save(300);return}
  if(!m)return;
  if(act==='start'){m.status='vivo';m.ga=0;m.gb=0;m.pen=null;save()}
  else if(act==='unstart'){m.status='pendiente';m.ga=0;m.gb=0;m.pen=null;save()}
  else if(act==='goal'){var k=b.getAttribute('data-side')==='a'?'ga':'gb';m[k]=Math.max(0,Math.min(99,m[k]+Number(b.getAttribute('data-d'))));if(m.ga!==m.gb)m.pen=null;save()}
  else if(act==='pen'){m.pen=b.getAttribute('data-side');save()}
  else if(act==='finish'){if(m.stage!=='liga'&&m.ga===m.gb&&!m.pen)return;m.status='final';m.endedAt=Date.now();save(300)}
  else if(act==='reopen'){if(!canReopen(m))return;m.status='vivo';save()}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='reorg-form'){e.preventDefault();if(!isAdmin())return;
    function rv(k){var el=document.getElementById(k);return el?el.value.trim():''}
    var nt2=[1,2].map(function(i){return{id:uid(),name:rv('n'+i+'-name'),p1:rv('n'+i+'-p1'),p2:rv('n'+i+'-p2'),club:rv('n'+i+'-club')}});
    if(nt2.some(function(t){return!t.name||!t.p1||!t.p2||!t.club})){playinErr='Llena todos los campos de los 2 equipos.';render();return}
    var all2=S.teams.concat(nt2);
    function dup2(k){var seen={};return all2.some(function(t){var v=t[k].toLowerCase();if(seen[v])return true;seen[v]=1;return false})}
    if(dup2('name')){playinErr='Hay dos equipos con el mismo nombre. Usa otro.';render();return}
    if(dup2('club')){playinErr='Ese club ya lo tiene otro equipo. Escojan otro.';render();return}
    if(S.matches.some(function(m){return m.status==='vivo'})){playinErr='Hay un partido en vivo. Termínalo primero.';render();return}
    if(confirmKey!=='reorg'){confirmKey='reorg';playinErr='';render();return}
    confirmKey=null;playinErr='';
    var played=sortedMatches().filter(function(m){return m.status==='final'&&playable(m)});
    var kept=played.map(function(m,i){var sd=sides(m);return{id:m.id,stage:'prev',ord:10+i,a:sd[0],b:sd[1],ga:m.ga,gb:m.gb,pen:m.pen,status:'final',endedAt:m.endedAt}});
    S.teams.push(nt2[0],nt2[1]);
    kept.push({id:uid(),stage:'prev',ord:10+kept.length,a:nt2[0].id,b:nt2[1].id,ga:0,gb:0,pen:null,status:'pendiente'});
    S.matches=kept;
    ['n1','n2'].forEach(function(p){['name','p1','p2','club'].forEach(function(k){var el=document.getElementById(p+'-'+k);if(el)el.value=''})});
    tab='vivo';save();toast('Listo: primera ronda armada.');return}
  if(e.target.id==='playin-form'){e.preventDefault();if(!isAdmin())return;
    function pv(k){var el=document.getElementById(k);return el?el.value.trim():''}
    var nt=[1,2].map(function(i){return{id:uid(),name:pv('n'+i+'-name'),p1:pv('n'+i+'-p1'),p2:pv('n'+i+'-p2'),club:pv('n'+i+'-club')}});
    var tgt=M(pv('n-target'));
    if(nt.some(function(t){return!t.name||!t.p1||!t.p2||!t.club})){playinErr='Llena todos los campos de los 2 equipos.';render();return}
    var all=S.teams.concat(nt);
    function dup(k){var seen={};return all.some(function(t){var v=t[k].toLowerCase();if(seen[v])return true;seen[v]=1;return false})}
    if(dup('name')){playinErr='Hay dos equipos con el mismo nombre. Usa otro.';render();return}
    if(dup('club')){playinErr='Ese club ya lo tiene otro equipo. Escojan otro.';render();return}
    if(!tgt||playinTargets().indexOf(tgt)<0){playinErr='Ese cruce ya no está disponible. Elige otro.';render();return}
    if(confirmKey!=='playin'){confirmKey='playin';playinErr='';render();return}
    confirmKey=null;playinErr='';
    S.teams.push(nt[0],nt[1]);
    var X={id:uid(),stage:'extra',label:'Repechaje',ord:tgt.round*100-50,a:nt[0].id,b:nt[1].id,ga:0,gb:0,pen:null,status:'pendiente'};
    var Y={id:uid(),stage:'extra',label:'Repechaje final',ord:tgt.round*100+90,feedA:tgt.id,feedB:X.id,ga:0,gb:0,pen:null,status:'pendiente'};
    tgt.via=Y.id;S.matches.push(X,Y);
    ['n1','n2'].forEach(function(p){['name','p1','p2','club'].forEach(function(k){var el=document.getElementById(p+'-'+k);if(el)el.value=''})});
    tab='partidos';save();toast('Repechaje creado.');return}
  if(e.target.id==='edit-form'){e.preventDefault();if(!isAdmin())return;
    var t=T(e.target.getAttribute('data-id'));if(!t){editId=null;render();return}
    function ev(k){return document.getElementById(k).value.trim()}
    var n=ev('e-name'),a=ev('e-p1'),b=ev('e-p2'),c=ev('e-club');
    if(!n||!a||!b||!c){editErr='Llena los cuatro campos.';render();return}
    if(S.teams.some(function(x){return x.id!==t.id&&x.name.toLowerCase()===n.toLowerCase()})){editErr='Ya hay otro equipo llamado “'+n+'”.';render();return}
    if(S.teams.some(function(x){return x.id!==t.id&&x.club.toLowerCase()===c.toLowerCase()})){editErr=c+' ya lo tiene otro equipo.';render();return}
    t.name=n;t.p1=a;t.p2=b;t.club=c;editId=null;editErr='';save();toast('Cambios guardados.');return}
  if(e.target.id==='login-form'){e.preventDefault();
    var pw=document.getElementById('f-pass').value;loginErr='';
    api('POST',{password:pw,check:true}).then(function(r){
      if(r.ok){pass=pw;lset(PKEY,pw);canEdit=true;adminMode=true;tab='admin';render();return}
      loginErr=r.status===401?'Contraseña incorrecta.':(r.j.error||'No se pudo verificar la contraseña.');render();
    }).catch(function(){loginErr='Sin conexión. Intenta de nuevo.';render()});
    return}
  if(e.target.id!=='team-form')return;e.preventDefault();if(!isAdmin())return;
  function v(k){return document.getElementById(k).value.trim()}
  var name=v('f-name'),p1=v('f-p1'),p2=v('f-p2'),club=v('f-club');
  if(!name||!p1||!p2||!club){formErr='Llena los cuatro campos.';render();return}
  if(S.teams.some(function(t){return t.name.toLowerCase()===name.toLowerCase()})){formErr='Ya hay un equipo llamado “'+name+'”. Usa otro nombre.';render();return}
  if(S.teams.some(function(t){return t.club.toLowerCase()===club.toLowerCase()})){formErr=club+' ya lo eligió otro equipo. Escojan otro club.';render();return}
  var nt={id:uid(),name:name,p1:p1,p2:p2,club:club};
  if(S.phase==='torneo'){
    if(S.format!=='liga'&&!freeByes().length){formErr='Ya no hay lugares libres en las llaves.';render();return}
    S.teams.push(nt);addLateTeam(nt);
  }else S.teams.push(nt);
  formErr='';toast(S.phase==='torneo'?name+' ya está en el torneo.':name+' inscrito.');
  ['f-name','f-p1','f-p2','f-club'].forEach(function(k){document.getElementById(k).value=''});
  save();document.getElementById('f-name')&&document.getElementById('f-name').focus();
});

render();
if(pass){api('POST',{password:pass,check:true}).then(function(r){if(r.ok)canEdit=true;else if(r.status===401){pass='';lset(PKEY,null)}render()}).catch(function(){})}
pull();
setInterval(pull,3000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
})();
</script>
</body>
